<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Avançada</title>

<style>
body{font-family:Arial;background:#f2f4f8;margin:0}
header{background:#111;color:#fff;padding:12px;display:flex;justify-content:space-between}
.card{background:#fff;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc}
button{background:#111;color:#fff;border:0}
.ok{background:#2e7d32}
.warn{background:#f9a825;color:#000}
.danger{background:#c62828}
.ag{background:#fafafa;border-left:5px solid #1565c0;margin-top:8px;padding:10px;border-radius:10px}
.ag.pago{border-left-color:#2e7d32}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rel-item{padding:10px;border-radius:10px;background:#f0f0f0;text-align:center;font-weight:bold}
.rel-item span{display:block;font-size:12px}
#btnConfig{position:fixed;right:15px;bottom:20px;width:55px;height:55px;border-radius:50%;background:#2e7d32;color:#fff;font-size:22px}
</style>
</head>

<body>

<header>
 <b>📅 Agenda Avançada</b>
 <button onclick="toggleTema()">🌙</button>
</header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="fBusca" placeholder="Buscar" oninput="render()">
 <input id="fData" type="date" onchange="render()">
 <select id="fStatus" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <b>📊 Relatórios</b>
 <div id="relatorio"></div>
</div>

<div class="card">
 <div id="lista"></div>
</div>

<div id="boxDrive" style="display:none">
 <button onclick="conectarDrive()">🔑 Conectar Drive</button>
 <button onclick="loginGoogle()">🔐 Login</button>
 <button onclick="salvarDrive()">☁️ Backup</button>
 <button onclick="carregarDrive()">📥 Restaurar</button>
</div>

<button id="btnConfig" onclick="toggleDrive()">⚙️</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
let ag=[];
let editId=null;
let accessToken=null;

const CLIENT_ID="877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com";

const firebaseConfig={
 apiKey:"AIzaSyBMQrLWFnEcrf2-6k_CZZfMvCmLYtY6Lf0",
 authDomain:"ferramentas-projeto.firebaseapp.com",
 projectId:"ferramentas-projeto"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* LOCAL + FIREBASE */
function salvarLocal(){
 localStorage.setItem("agenda",JSON.stringify(ag));
 ag.forEach(a=>db.collection("agenda").doc(String(a.id)).set(a,{merge:true}));
}

function carregarLocal(){
 ag=JSON.parse(localStorage.getItem("agenda")||"[]");
 db.collection("agenda").onSnapshot(s=>{
  s.docChanges().forEach(c=>{
   let d=c.doc.data();
   let i=ag.findIndex(a=>a.id==d.id);
   if(c.type==="added"&&i==-1)ag.push(d);
   if(c.type==="modified"&&i>-1)ag[i]=d;
   if(c.type==="removed")ag=ag.filter(a=>a.id!=d.id);
  });
  salvarLocal();render();
 });
}

/* CRUD */
function salvar(){
 if(!cliente.value||!data.value||!hora.value)return alert("Preencha tudo");

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value};
 }else{
  ag.push({id:Date.now(),cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value,pago:false});
 }

 salvarLocal();limpar();render();
}

function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;tel.value=a.tel;data.value=a.data;hora.value=a.hora;valor.value=a.valor;
 editId=id;
}

function excluir(id){
 ag=ag.filter(a=>a.id!==id);
 db.collection("agenda").doc(String(id)).delete();
 salvarLocal();render();
}

function pagar(id){
 let a=ag.find(x=>x.id===id);
 a.pago=true;
 salvarLocal();render();
}

/* RELATÓRIO */
function gerarRelatorio(){
 let hoje=fData.value||new Date().toISOString().slice(0,10);
 let mes=hoje.slice(0,7);

 let totalDia=0,recebido=0,totalMes=0;

 ag.forEach(a=>{
  if(a.data===hoje){
   totalDia+=a.valor||0;
   if(a.pago)recebido+=a.valor||0;
  }
  if(a.data&&a.data.slice(0,7)===mes){
   totalMes+=a.valor||0;
  }
 });

 let pendente=totalDia-recebido;

 relatorio.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${totalDia.toFixed(2)}<span>Total do dia</span></div>
  <div class="rel-item">R$ ${recebido.toFixed(2)}<span>Recebido hoje</span></div>
  <div class="rel-item">R$ ${pendente.toFixed(2)}<span>Pendente</span></div>
  <div class="rel-item">R$ ${totalMes.toFixed(2)}<span>Total do mês</span></div>
 </div>`;
}

/* RENDER */
function render(){
 lista.innerHTML="";
 ag.forEach(a=>{
  lista.innerHTML+=`
  <div class="ag ${a.pago?'pago':''}">
   <b>${a.data} ${a.hora}</b><br>
   ${a.cliente} — R$ ${a.valor}<br>
   <button onclick="editar(${a.id})">✏️</button>
   <button onclick="pagar(${a.id})">💰</button>
   <button onclick="excluir(${a.id})">🗑</button>
  </div>`;
 });
 gerarRelatorio();
}

/* GOOGLE */
function conectarDrive(){
 const client=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:r=>{accessToken=r.access_token;alert("Drive conectado")}
 });
 client.requestAccessToken();
}

function loginGoogle(){
 google.accounts.id.initialize({
  client_id:CLIENT_ID,
  callback:()=>alert("Login OK")
 });
 google.accounts.id.prompt();
}

/* UI */
function toggleDrive(){
 boxDrive.style.display=boxDrive.style.display==="none"?"block":"none";
}

function toggleTema(){
 document.body.classList.toggle("dark");
}

function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

/* INIT */
window.onload=()=>{
 carregarLocal();
 render();
};
</script>

</body>
</html>
