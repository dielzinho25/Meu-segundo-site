<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda PRO</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;background:#121212;color:#fff;margin:0}
header{background:#000;padding:12px}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff}
button{background:#2e7d32;border:0}
.ag{background:#1e1e1e;margin-top:8px;padding:10px;border-radius:10px;border-left:5px solid #1565c0}
.ag.pago{border-left-color:#2e7d32}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-item{background:#2a2a2a;padding:10px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<header><b>📅 Agenda PRO</b></header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="busca" placeholder="Buscar..." oninput="render()">
 <select id="status" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup Drive</button>
 <button onclick="restaurarDrive()">📥 Restaurar</button>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card" id="lista"></div>

<script>
let ag=[];
let editId=null;

// LOCAL
function salvarLocal(){localStorage.setItem("agenda",JSON.stringify(ag))}
function carregarLocal(){ag=JSON.parse(localStorage.getItem("agenda")||"[]")}

// LIMPAR
function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

// SALVAR / EDITAR
function salvar(){
 if(!cliente.value||!data.value||!hora.value)return alert("Preencha tudo");

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value};
 }else{
  ag.push({
   id:Date.now(),
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:+valor.value,
   pago:false,
   favorito:false
  });
 }

 salvarLocal();
 if(accessToken) salvarDrive();
 limpar();
 render();
}

// EDITAR
function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;
 tel.value=a.tel;
 data.value=a.data;
 hora.value=a.hora;
 valor.value=a.valor;
 editId=id;
}

// EXCLUIR
function excluir(id){
 if(confirm("Excluir?")){
  ag=ag.filter(a=>a.id!==id);
  salvarLocal();
  if(accessToken) salvarDrive();
  render();
 }
}

// FAVORITO
function fav(id){
 let a=ag.find(x=>x.id===id);
 a.favorito=!a.favorito;
 salvarLocal();
 render();
}

// PAGAR
function pagar(id){
 let a = ag.find(x => x.id === id);

 a.pago = !a.pago; // alterna

 salvarLocal();
 if(accessToken) salvarDrive();
 render();
 }

// REAGENDAR
function reagendar(id){
 let a = ag.find(x => x.id === id);

 ag.push({
  ...a,
  id: Date.now(),
  pago: false,
  favorito: false
 });

 salvarLocal();
 if(accessToken) salvarDrive();
 render();

 alert("✅ Cópia criada, agora você pode editar");
 }

// DETALHES
function verDetalhes(id){
 let a=ag.find(x=>x.id===id);

 alert(
 "👤 "+a.cliente+
 "\n📞 "+a.tel+
 "\n📅 "+a.data+
 "\n⏰ "+a.hora+
 "\n💰 R$ "+a.valor+
 "\n⭐ "+(a.favorito?"Sim":"Não")+
 "\n💵 "+(a.pago?"Pago":"Pendente")
 );
}

// RELATÓRIO
function gerarRelatorio(){
 let hoje=new Date().toISOString().slice(0,10);
 let mes=hoje.slice(0,7);

 let totalDia=0, recebido=0, pendente=0, totalMes=0, qtd=0;

 ag.forEach(a=>{
  if(a.data===hoje){
   totalDia+=a.valor;
   if(a.pago) recebido+=a.valor;
   else pendente+=a.valor;
  }
  if(a.data.slice(0,7)===mes) totalMes+=a.valor;
  qtd++;
 });

 relatorio.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${totalDia.toFixed(2)}<br>Hoje</div>
  <div class="rel-item">R$ ${recebido.toFixed(2)}<br>Recebido</div>
  <div class="rel-item">R$ ${pendente.toFixed(2)}<br>Pendente</div>
  <div class="rel-item">R$ ${totalMes.toFixed(2)}<br>Mês</div>
  <div class="rel-item">${qtd}<br>Agendamentos</div>
 </div>`;
}

// RENDER (ATUALIZADO)
function render(){
 lista.innerHTML="";

 ag
 .filter(a=>{
  let b=busca.value.toLowerCase();
  if(b&&!a.cliente.toLowerCase().includes(b)&&!(a.tel||"").includes(b))return false;
  if(status.value==="pago"&&!a.pago)return false;
  if(status.value==="pendente"&&a.pago)return false;
  return true;
 })
 .sort((a,b)=>b.favorito - a.favorito || a.hora.localeCompare(b.hora))
 .forEach(a=>{
  lista.innerHTML+=`
  <div class="ag ${a.pago?'pago':''}">
   <b>${a.data} ${a.hora}</b><br>
   ${a.favorito?"⭐ ":""}${a.cliente} — R$ ${a.valor}
   <div>${a.tel||""}</div>

   <button onclick="verDetalhes(${a.id})">👁</button>
   <button onclick="editar(${a.id})">✏️</button>
   <button onclick="pagar(${a.id})">💰</button>
   <button onclick="fav(${a.id})">⭐</button>
   <button onclick="reagendar(${a.id})">🔁</button>
   <button onclick="excluir(${a.id})">🗑</button>
  </div>`;
 });

 gerarRelatorio();
}

// NOTIFICAÇÃO
function ativarNotif(){
 if(Notification.permission!=="granted") Notification.requestPermission();
}

function notificar(t,c){
 if(Notification.permission==="granted"){
  new Notification(t,{body:c});
 }
}

setInterval(()=>{
 let agora=new Date();
 ag.forEach(a=>{
  let d=new Date(a.data+"T"+a.hora);
  let diff=(d-agora)/60000;
  if(diff>9&&diff<10){
   notificar("⏰ Atendimento",a.cliente+" às "+a.hora);
  }
 });
},60000);

// GOOGLE
let tokenClient;
let accessToken=null;

const CLIENT_ID="877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com";

function initGoogle(){
 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:(res)=>{
   if(res.error)return alert("Erro login");
   accessToken=res.access_token;
   localStorage.setItem("token",accessToken);
   alert("Login OK");
  }
 });
}

function loginGoogle(){
 tokenClient.requestAccessToken();
}

// BACKUP AUTO
setInterval(()=>{
 if(accessToken) salvarDrive();
},15000);

// BACKUP
async function salvarDrive(){
 if(!accessToken) return alert("Faça login primeiro");

 let nome = "agenda_backup.json";

 let res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${nome}'`, {
  headers: { Authorization: "Bearer " + accessToken }
 });

 let data = await res.json();
 let fileId = data.files?.[0]?.id;

 let conteudo = JSON.stringify(ag);

 if(fileId){
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
   method: "PATCH",
   headers: {
    Authorization: "Bearer " + accessToken,
    "Content-Type": "application/json"
   },
   body: conteudo
  });
 } else {
  await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=media", {
   method: "POST",
   headers: {
    Authorization: "Bearer " + accessToken,
    "Content-Type": "application/json"
   },
   body: conteudo
  });
 }

 alert("✅ Backup salvo");
}

// RESTAURAR
async function restaurarDrive(){
 if(!accessToken) return alert("Faça login primeiro");

 let nome = "agenda_backup.json";

 let res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${nome}'`, {
  headers: { Authorization: "Bearer " + accessToken }
 });

 let data = await res.json();
 let fileId = data.files?.[0]?.id;

 if(!fileId) return alert("Nenhum backup encontrado");

 let file = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
  headers: { Authorization: "Bearer " + accessToken }
 });

 ag = await file.json();

 salvarLocal();
 render();

 alert("✅ Dados restaurados");
  }

// INIT
window.onload=()=>{
 carregarLocal();
 render();
 initGoogle();
 ativarNotif();

 let t=localStorage.getItem("token");
 if(t)accessToken=t;
}

 if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("sw.js");
 }
 
</script>

</body>
 </html>
