<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda PRO</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;background:#121212;color:#fff;margin:0}
header{background:#000;padding:12px;display:flex;justify-content:space-between}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff}
button{background:#2e7d32;border:0}
.ag{background:#1e1e1e;margin-top:8px;padding:10px;border-radius:10px;border-left:5px solid #1565c0}
.ag.pago{border-left-color:#2e7d32}
</style>
</head>

<body>

<header>
 <b>📅 Agenda PRO</b>
</header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="busca" placeholder="Buscar..." oninput="render()">
 <select id="status" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup Drive</button>
 <button onclick="restaurarDrive()">📥 Restaurar</button>
</div>

<div class="card" id="lista"></div>

<script>
let ag=[];

// LOCAL
function salvarLocal(){localStorage.setItem("agenda",JSON.stringify(ag))}
function carregarLocal(){ag=JSON.parse(localStorage.getItem("agenda")||"[]")}

// SALVAR
function salvar(){
 ag.push({
  id:Date.now(),
  cliente:cliente.value,
  tel:tel.value,
  data:data.value,
  hora:hora.value,
  valor:+valor.value,
  pago:false,
  favorito:false
 });
 salvarLocal();render();
}

// FAVORITO
function fav(id){
 let a=ag.find(x=>x.id===id);
 a.favorito=!a.favorito;
 salvarLocal();render();
}

// PAGAR
function pagar(id){
 let a=ag.find(x=>x.id===id);
 a.pago=true;
 salvarLocal();render();
}

// REAGENDAR
function reagendar(id){
 let d=prompt("Nova data");
 let h=prompt("Nova hora");
 if(!d||!h)return;
 let a=ag.find(x=>x.id===id);
 ag.push({...a,id:Date.now(),data:d,hora:h,pago:false});
 salvarLocal();render();
}

// RENDER
function render(){
 lista.innerHTML="";
 ag
 .filter(a=>{
  let b=busca.value.toLowerCase();
  if(b&&!a.cliente.toLowerCase().includes(b))return false;
  if(status.value==="pago"&&!a.pago)return false;
  if(status.value==="pendente"&&a.pago)return false;
  return true;
 })
 .sort((a,b)=>b.favorito-a.favorito)
 .forEach(a=>{
  lista.innerHTML+=`
  <div class="ag ${a.pago?'pago':''}">
   ${a.favorito?"⭐":""} ${a.cliente} - ${a.data} ${a.hora}<br>
   R$ ${a.valor}
   <button onclick="fav(${a.id})">⭐</button>
   <button onclick="pagar(${a.id})">💰</button>
   <button onclick="reagendar(${a.id})">🔁</button>
  </div>`;
 });
}

// NOTIFICAÇÃO
function notificar(t,c){
 if(Notification.permission==="granted"){
  new Notification(t,{body:c});
 }
}

function ativarNotif(){
 if(Notification.permission!=="granted"){
  Notification.requestPermission();
 }
}

// AUTO ALERTA
setInterval(()=>{
 let agora=new Date();
 ag.forEach(a=>{
  let d=new Date(a.data+"T"+a.hora);
  let diff=(d-agora)/60000;
  if(diff>9&&diff<10){
   notificar("⏰ Atendimento",a.cliente+" às "+a.hora);
  }
 });
},60000);

// GOOGLE
let tokenClient;
let accessToken=null;

const CLIENT_ID="877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com";

function initGoogle(){
 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:(res)=>{
   accessToken=res.access_token;
   localStorage.setItem("token",accessToken);
   alert("Login OK");
  }
 });
}

function loginGoogle(){
 tokenClient.requestAccessToken();
}

// BACKUP
async function salvarDrive(){
 if(!accessToken)return alert("Login primeiro");

 let nome="agenda_backup.json";

 let res=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${nome}'`,
 {headers:{Authorization:"Bearer "+accessToken}});

 let data=await res.json();
 let fileId=data.files?.[0]?.id;

 let conteudo=JSON.stringify(ag);

 if(fileId){
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{
   method:"PATCH",
   headers:{Authorization:"Bearer "+accessToken},
   body:conteudo
  });
 }else{
  let form=new FormData();
  form.append("metadata",new Blob([JSON.stringify({name:nome})],{type:"application/json"}));
  form.append("file",new Blob([conteudo],{type:"application/json"}));

  await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
   method:"POST",
   headers:{Authorization:"Bearer "+accessToken},
   body:form
  });
 }
 alert("Backup OK");
}

// RESTAURAR
async function restaurarDrive(){
 if(!accessToken)return alert("Login primeiro");

 let nome="agenda_backup.json";

 let res=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${nome}'`,
 {headers:{Authorization:"Bearer "+accessToken}});

 let data=await res.json();
 let fileId=data.files?.[0]?.id;

 let file=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
 {headers:{Authorization:"Bearer "+accessToken}});

 ag=await file.json();
 salvarLocal();render();
}

// INIT
window.onload=()=>{
 carregarLocal();
 render();
 initGoogle();
 ativarNotif();
 let t=localStorage.getItem("token");
 if(t)accessToken=t;
}
</script>

</body>
 </html>
