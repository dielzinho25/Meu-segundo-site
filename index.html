<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Avançada</title>

<style>
body{font-family:Arial;background:#f2f4f8;margin:0}
header{background:#111;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc}
button{background:#111;color:#fff;border:0;cursor:pointer}
.ok{background:#2e7d32}
.warn{background:#f9a825;color:#000}
.danger{background:#c62828}
.ag{background:#fafafa;border-left:5px solid #1565c0;margin-top:8px;padding:10px;border-radius:10px}
.ag.pago{border-left-color:#2e7d32}
.small{font-size:12px;color:#555}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rel-item{padding:10px;border-radius:10px;background:#f0f0f0;text-align:center;font-weight:bold}
.rel-item span{display:block;font-size:12px;opacity:.8}
body.dark{background:#121212;color:#e0e0e0}
body.dark header{background:#000}
body.dark .card,body.dark .ag,body.dark .rel-item{background:#1e1e1e}
body.dark input{background:#2a2a2a;color:#fff;border:1px solid #444}
body.dark button{background:#333}
 btnConfig{
 position: fixed;
 right: 15px;
 bottom: 20px;
 width: 55px;
 height: 55px;
 border-radius: 50%;
 background: #2e7d32;
 color: #fff;
 font-size: 22px;
 border: none;
 box-shadow: 0 4px 10px rgba(0,0,0,0.4);
 z-index: 999;
 }
</style>
</head>

<body>

<header>
 <b>📅 Agenda Avançada</b>
 <button onclick="toggleTema()">🌙</button>
</header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone / WhatsApp">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="fBusca" placeholder="🔍 Buscar por nome ou telefone" oninput="render()">
 <input id="fData" type="date" onchange="render()">
 <select id="fStatus" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card">
 <div id="lista"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

 <!-- BOTÕES GOOGLE (SEM DUPLICAÇÃO) -->
<div id="boxDrive" style="display:none">

 <button onclick="conectarDrive()">🔑 Conectar Drive</button>
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup Drive</button>
 <button onclick="carregarDrive()">📥 Restaurar Backup</button>
 <button onclick="excluirDrive()">🗑 Excluir Backup</button>
 <button onclick="renomearDrive('agenda_backup.json')">✏️ Renomear</button>

</div>
 
<script>
let ag=[];
let editId=null;
let ag=[],editId=null;
let accessToken = null;

function toggleDrive(){
 let box = document.getElementById("boxDrive");

 if(box.style.display === "none"){
  box.style.display = "block";
 }else{
  box.style.display = "none";
 }
 }

 async function renomearDrive(novoNome){
 let fileId = localStorage.getItem("drive_file_id");

 await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`,{
  method:"PATCH",
  headers:{
   Authorization:"Bearer "+accessToken,
   "Content-Type":"application/json"
  },
  body: JSON.stringify({
   name: novoNome
  })
 });

 alert("Nome alterado ✏️");
 }

 async function excluirDrive(){
 if(!accessToken){
  alert("Conecte o Drive primeiro");
  return;
 }

 let fileId = localStorage.getItem("drive_file_id");

 if(!fileId){
  alert("Nenhum arquivo encontrado");
  return;
 }

 await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`,{
  method:"DELETE",
  headers:{
   Authorization:"Bearer "+accessToken
  }
 });

 localStorage.removeItem("drive_file_id");

 alert("Arquivo excluído 🗑");
 }

 async function syncDrive(){
 if(!accessToken) return;

 let fileId = localStorage.getItem("drive_file_id");
 if(!fileId) return;

 try{
  let res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
   headers:{ Authorization:"Bearer "+accessToken }
  });

  let dadosDrive = await res.json();

  // juntar sem duplicar
  let todos = [...ag, ...dadosDrive];

  let unico = [];
  let ids = new Set();

  todos.forEach(item=>{
   if(!ids.has(item.id)){
    ids.add(item.id);
    unico.push(item);
   }
  });

  ag = unico;

  salvarLocal();
  render();

 }catch(e){
  console.log("Erro sync:", e);
 }
 }

 async function carregarDrive(){
 if(!accessToken){
  alert("Conecte o Drive primeiro");
  return;
 }

 let fileId = localStorage.getItem("drive_file_id");

 if(!fileId){
  alert("Nenhum backup encontrado");
  return;
 }

 let res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
  headers:{
   Authorization: "Bearer " + accessToken
  }
 });

 let dados = await res.json();

 ag = dados;
 salvarLocal();
 render();

 alert("Dados restaurados 🚀");
 }

 function conectarDrive(){
 const client = google.accounts.oauth2.initTokenClient({
  client_id: "877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com",
  scope: "https://www.googleapis.com/auth/drive.file",
  callback: (res)=>{
   accessToken = res.access_token;
   alert("Drive conectado 🚀");
  }
 });

 client.requestAccessToken();
}
 
/* LOCAL */
function salvarLocal(){localStorage.setItem("agenda",JSON.stringify(ag))}
function carregarLocal(){ag=JSON.parse(localStorage.getItem("agenda")||"[]")}

/* CRUD */
function salvar(){
 if(!cliente.value||!data.value||!hora.value) return alert("Preencha tudo");

 ag.push({
  id:Date.now(),
  cliente:cliente.value,
  tel:tel.value,
  data:data.value,
  hora:hora.value,
  valor:+valor.value||0,
  pago:false,
  favorito:false,
  confirmado:false
 });

 salvarLocal();
 render();
 }
 function excluir(id){
 ag=ag.filter(a=>a.id!==id);
 salvarLocal();
 render();
}

function pagar(id){
 let a=ag.find(x=>x.id===id);
 a.pago=true;
 salvarLocal();
 render();
}

function favoritar(id){
 let a=ag.find(x=>x.id===id);
 a.favorito=!a.favorito;
 salvarLocal();
 render();
}

function confirmar(id){
 let a=ag.find(x=>x.id===id);
 a.confirmado=true;
 salvarLocal();
 render();
}

function enviarZap(id){
 let a=ag.find(x=>x.id===id);
 if(!a.tel)return alert("Sem telefone");
 let numero=a.tel.replace(/\D/g,"");
 let msg=encodeURIComponent("Olá "+a.cliente+" confirme seu horário "+a.hora);
 window.open("https://wa.me/55"+numero+"?text="+msg);
 }

 /* GOOGLE DRIVE */
const CLIENT_ID = "877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com";
const API_KEY = "AIzaSyBFItoKlSptv86j5Mo1XwwlJSTzJFgQ5No";

 function initGoogle(){
 gapi.load('client:auth2', async ()=>{
  await gapi.client.init({
   apiKey: API_KEY,
   clientId: CLIENT_ID,
   discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
   scope: "https://www.googleapis.com/auth/drive.file"
  });
  alert("Google conectado!");
 });
}

function loginGoogle(){
 google.accounts.id.initialize({
  client_id: "877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com",
  callback: handleCredentialResponse
 });

 google.accounts.id.prompt();
}

function handleCredentialResponse(response){
 console.log("TOKEN:", response.credential);

 alert("Login realizado com sucesso 🚀");
 }

 async function salvarDrive(){
 if(!accessToken){
  alert("Conecte o Drive primeiro");
  return;
 }

 let fileId = localStorage.getItem("drive_file_id");

 let dadosDrive = [];

 // 🔥 1. BUSCAR DADOS ANTIGOS
 if(fileId){
  try{
   let res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
    headers:{ Authorization:"Bearer "+accessToken }
   });
   dadosDrive = await res.json();
  }catch(e){
   dadosDrive = [];
  }
 }

 // 🔥 2. JUNTAR SEM DUPLICAR
 let todos = [...dadosDrive, ...ag];

 let unico = [];
 let ids = new Set();

 todos.forEach(item=>{
  if(!ids.has(item.id)){
   ids.add(item.id);
   unico.push(item);
  }
 });

  // 🔥 3. SALVAR
 let arquivo = new Blob([JSON.stringify(unico)], {type:"application/json"});

 let form = new FormData();
 form.append("metadata", new Blob([JSON.stringify({
  name:"agenda_backup.json"
 })], {type:"application/json"}));

 form.append("file", arquivo);

 let url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
 let method = "POST";

 if(fileId){
  url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`;
  method = "PATCH";
 }

 let res = await fetch(url,{
  method:method,
  headers:{ Authorization:"Bearer "+accessToken },
  body:form
 });

 let data = await res.json();

 if(!fileId){
  localStorage.setItem("drive_file_id", data.id);
 }

 alert("Backup sincronizado ☁️🚀");
 }

 
const firebaseConfig = {
  apiKey: "AIzaSyDrtZxbKXk7hjlqBL_BLoZMTBdc5iqBCXo",
  authDomain: "ferramentas-projeto.firebaseapp.com",
  projectId: "ferramentas-projeto",
  storageBucket: "ferramentas-projeto.appspot.com",
  messagingSenderId: "877191590019",
  appId: "1:877191590019:android:152d4d35bdd3024c53abb6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


/* ===== SALVAR ===== */
async function salvarLocal(){
 localStorage.setItem("agenda_local", JSON.stringify(ag));
 for (let item of ag) {
  await db.collection("agenda").doc(String(item.id)).set(item,{merge:true});
 }
}

/* ===== CARREGAR + TEMPO REAL ===== */
function carregarLocal(){
 ag = JSON.parse(localStorage.getItem("agenda_local") || "[]");
 render();

 db.collection("agenda").onSnapshot(snapshot=>{
  snapshot.docChanges().forEach(change=>{
   const dados=change.doc.data();
   const i=ag.findIndex(a=>a.id==dados.id);

   if(change.type==="added" && i===-1) ag.push(dados);
   if(change.type==="modified" && i>-1) ag[i]=dados;
   if(change.type==="removed") ag=ag.filter(a=>a.id!=dados.id);
  });
  localStorage.setItem("agenda_local", JSON.stringify(ag));
  render();
 });
}

/* ===== RESTANTE ORIGINAL ===== */

function toggleTema(){
 document.body.classList.toggle("dark");
 localStorage.setItem("tema_dark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("tema_dark")==="true")document.body.classList.add("dark");

function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

function salvar(){
 if(!cliente.value||!data.value||!hora.value) return alert("Preencha tudo");

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  if(ag[i].pago) return alert("Agendamento pago não pode ser editado");
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value};
 }else{
  ag.push({
   id:Date.now(),
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:+valor.value,
   reservado:true,
   pago:false,
   pagoEm:"",
   horaPagamento:"",
   favorito:false
  });
 }
 salvarLocal();limpar();render();
}

function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;tel.value=a.tel;data.value=a.data;hora.value=a.hora;valor.value=a.valor;
 editId=id;
}

function pagar(id){
 let a=ag.find(x=>x.id===id);
 let d=new Date();
 a.pago=true;
 a.pagoEm=d.toLocaleDateString();
 a.horaPagamento=d.toLocaleTimeString();
 salvarLocal();render();
}

function reservar(id){
 let a=ag.find(x=>x.id===id);
 ag.push({...a,id:Date.now(),pago:false,pagoEm:"",horaPagamento:""});
 salvarLocal();render();
}

function excluir(id){
 if(confirm("Excluir agendamento?")){
  ag=ag.filter(a=>a.id!==id);
  db.collection("agenda").doc(String(id)).delete();
  salvarLocal();render();
 }
}

function favoritar(id){
 let a=ag.find(x=>x.id===id);
 a.favorito=!a.favorito;
 salvarLocal();render();
}

function gerarRelatorio(){
 let hoje=fData.value||new Date().toISOString().slice(0,10);
 let mes=hoje.slice(0,7);
 let dT=0,dP=0,mT=0;
 ag.forEach(a=>{
  if(a.data===hoje){dT+=a.valor;if(a.pago)dP+=a.valor}
  if(a.data.slice(0,7)===mes)mT+=a.valor;
 });
 relatorio.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${dT}<span>Total do dia</span></div>
  <div class="rel-item">R$ ${dP}<span>Recebido hoje</span></div>
  <div class="rel-item">R$ ${dT-dP}<span>Pendente</span></div>
  <div class="rel-item">R$ ${mT}<span>Total do mês</span></div>
 </div>`;
}
 gerarRelatorio();
}


function render(){
 lista.innerHTML="";
 ag
 .filter(a=>{
  let b=fBusca.value.toLowerCase();
  if(b){
   if(!a.cliente.toLowerCase().includes(b) && !(a.tel||"").toLowerCase().includes(b)) return false;
  }
  if(fData.value&&a.data!==fData.value)return false;
  if(fStatus.value==="pago"&&!a.pago)return false;
  if(fStatus.value==="pendente"&&a.pago)return false;
  return true;
 })
 .sort((a,b)=>b.favorito-a.favorito||a.hora.localeCompare(b.hora))
 .forEach(a=>{
  lista.innerHTML+=`
  <div class="ag ${a.pago?'pago':''}">
   <b>${a.data} ${a.hora}</b><br>
   ${a.favorito?"⭐ ":""}${a.cliente} — R$ ${a.valor}<br>
   <span class="small">
    ${a.tel||""}<br>
    ${a.pago?`Pago em ${a.pagoEm} ${a.horaPagamento}`:"Reservado"}
   </span>
   <button onclick="favoritar(${a.id})">${a.favorito?"⭐ Favorito":"☆ Favoritar"}</button>
   <button onclick="editar(${a.id})">✏️</button>
   <button class="ok" onclick="pagar(${a.id})">💰</button>
   <button class="warn" onclick="reservar(${a.id})">🔁</button>
   <button class="danger" onclick="excluir(${a.id})">🗑</button>
  </div>`;
 });
 gerarRelatorio();
}

window.onload=()=>carregarLocal();
 window.onload = ()=>{
 carregarLocal();
 render();

 setTimeout(()=>{
  if(accessToken){
   carregarDrive();
  }
 },2000);
 }

window.onload = ()=>{
 carregarLocal();
 render();

 setTimeout(()=>{
  syncDrive();
 },2000);
 }
 
salvarLocal();
render();

if(accessToken){
 salvarDrive();
 }

 setInterval(()=>{
 syncDrive();
}, 10000); // a cada 5 segundos
 </script>
<button onclick="toggleDrive()" id="btnConfig">⚙️</button>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</script>

</body>
</html>
