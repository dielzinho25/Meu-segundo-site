<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda PRO</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;background:#121212;color:#fff;margin:0}
header{background:#000;padding:12px}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff}
button{background:#2e7d32;border:0}
.ag{background:#1e1e1e;margin-top:8px;padding:10px;border-radius:10px;border-left:5px solid #1565c0}
.ag.pago{border-left-color:#2e7d32}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-item{background:#2a2a2a;padding:10px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<header><b>📅 Agenda PRO</b></header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="busca" placeholder="Buscar...">
 <input type="date" id="buscaData">
 <select id="status">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup Drive</button>
 <button onclick="restaurarDrive()">📥 Restaurar</button>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card" id="lista"></div>

<script>
let ag=[];
let editId=null;

// LOCAL
function salvarLocal(){localStorage.setItem("agenda",JSON.stringify(ag))}
function carregarLocal(){ag=JSON.parse(localStorage.getItem("agenda")||"[]")}

// LIMPAR
function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

// SALVAR
function salvar(){
 if(!cliente.value||!data.value||!hora.value)return alert("Preencha tudo");

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value};
 }else{
  ag.push({
   id:Date.now(),
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:+valor.value,
   pago:false,
   favorito:false
  });
 }

 salvarLocal();
 if(accessToken) salvarDrive();
 limpar();
 render();
}

// EDITAR / EXCLUIR / OUTROS (mantido igual)
function editar(id){let a=ag.find(x=>x.id===id);cliente.value=a.cliente;tel.value=a.tel;data.value=a.data;hora.value=a.hora;valor.value=a.valor;editId=id;}
function excluir(id){if(confirm("Excluir?")){ag=ag.filter(a=>a.id!==id);salvarLocal();render();}}
function fav(id){let a=ag.find(x=>x.id===id);a.favorito=!a.favorito;salvarLocal();render();}
function pagar(id){let a=ag.find(x=>x.id===id);a.pago=!a.pago;salvarLocal();render();}
function reagendar(id){let a=ag.find(x=>x.id===id);ag.push({...a,id:Date.now(),pago:false,favorito:false});salvarLocal();render();}
function verDetalhes(id){let a=ag.find(x=>x.id===id);alert(`${a.cliente}\n${a.tel}\n${a.data} ${a.hora}\nR$ ${a.valor}`);}

// RENDER
function render(){
 let lista = document.getElementById("lista");
 let busca = document.getElementById("busca").value.toLowerCase();
 let status = document.getElementById("status").value;
 let dataFiltro = document.getElementById("buscaData").value;

 lista.innerHTML="";

 ag
 .filter(a=>{
  if(busca && !a.cliente.toLowerCase().includes(busca) && !(a.tel||"").includes(busca)) return false;
  if(dataFiltro && a.data!==dataFiltro) return false;
  if(status==="pago" && !a.pago) return false;
  if(status==="pendente" && a.pago) return false;
  return true;
 })
 .sort((a,b)=>b.favorito-a.favorito || a.hora.localeCompare(b.hora))
 .forEach(a=>{
  lista.innerHTML+=`
  <div class="ag ${a.pago?'pago':''}">
   <b>${a.data} ${a.hora}</b><br>
   ${a.favorito?"⭐ ":""}${a.cliente} — R$ ${Number(a.valor).toFixed(2)}
   <div>${a.tel||""}</div>
   <button onclick="verDetalhes(${a.id})">👁</button>
   <button onclick="editar(${a.id})">✏️</button>
   <button onclick="pagar(${a.id})">💰</button>
   <button onclick="fav(${a.id})">⭐</button>
   <button onclick="reagendar(${a.id})">🔁</button>
   <button onclick="excluir(${a.id})">🗑</button>
  </div>`;
 });

 gerarRelatorio();
}

// RELATÓRIO
function gerarRelatorio(){
 let el=document.getElementById("relatorio");
 let hoje=new Date().toISOString().slice(0,10);
 let mes=hoje.slice(0,7);

 let tDia=0,rec=0,pend=0,tMes=0;

 ag.forEach(a=>{
  let v=Number(a.valor)||0;
  if(a.data===hoje){tDia+=v;if(a.pago)rec+=v;}
  if(!a.pago) pend+=v;
  if(a.data && a.data.startsWith(mes)) tMes+=v;
 });

 el.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${tDia.toFixed(2)}<br>Hoje</div>
  <div class="rel-item">R$ ${rec.toFixed(2)}<br>Recebido</div>
  <div class="rel-item">R$ ${pend.toFixed(2)}<br>Pendente</div>
  <div class="rel-item">R$ ${tMes.toFixed(2)}<br>Mês</div>
  <div class="rel-item">${ag.length}<br>Agendamentos</div>
 </div>`;
}

// GOOGLE + DRIVE (mantido funcional)
let tokenClient,accessToken=null;
const CLIENT_ID="877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com";

function initGoogle(){
 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:(res)=>{accessToken=res.access_token;localStorage.setItem("token",accessToken);}
 });
}

function loginGoogle(){tokenClient.requestAccessToken();}

// INIT
window.onload=()=>{
 carregarLocal();
 render();
 initGoogle();

 let t=localStorage.getItem("token");
 if(t) accessToken=t;

 document.getElementById("busca").addEventListener("input",render);
 document.getElementById("buscaData").addEventListener("change",render);
 document.getElementById("status").addEventListener("change",render);
};
</script>

</body>
</html>
