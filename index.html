<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agenda PRO</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:Arial;background:#121212;color:#fff;margin:0}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:none}
input,select{background:#2a2a2a;color:#fff}
button{background:#2e7d32;color:#fff;font-weight:bold}
.ag{background:#2a2a2a;margin-top:8px;padding:10px;border-radius:10px}

/* botão flutuante */
#btnConfig{
 position:fixed;
 right:15px;
 bottom:20px;
 width:55px;
 height:55px;
 border-radius:50%;
 background:#2e7d32;
 color:#fff;
 font-size:22px;
 border:none;
 z-index:999;
}

#boxDrive{display:none}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-item{background:#2a2a2a;padding:10px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="fBusca" placeholder="Buscar" oninput="render()">
 <input id="fData" type="date" onchange="render()">
 <select id="fStatus" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card">
 <div id="lista"></div>
</div>

<div id="boxDrive" class="card">
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup</button>
 <button onclick="carregarDrive()">📥 Restaurar</button>
</div>

<button id="btnConfig" onclick="toggleDrive()">⚙️</button>

<script>
let ag=[];
let editId=null;
let accessToken=null;
let CLIENT_ID="COLOCA_SEU_CLIENT_ID_AQUI";

/* LOCAL */
function salvarLocal(){localStorage.setItem("agenda",JSON.stringify(ag))}
function carregarLocal(){ag=JSON.parse(localStorage.getItem("agenda")||"[]")}

/* LOGIN GOOGLE */
function loginGoogle(){
 google.accounts.oauth2.initTokenClient({
  client_id: CLIENT_ID,
  scope: "https://www.googleapis.com/auth/drive.file",
  callback: (resp)=>{
   accessToken = resp.access_token;
   alert("Conectado 🚀");
  }
 }).requestAccessToken();
}

/* SALVAR */
function salvar(){
 if(!cliente.value||!data.value||!hora.value) return alert("Preencha");

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value||0};
 }else{
  ag.push({
   id:Date.now(),
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:+valor.value||0,
   pago:false
  });
 }

 salvarLocal();
 render();

 // 🔥 AUTO BACKUP
 if(accessToken) salvarDrive();

 limpar();
}

function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

/* RENDER */
function render(){
 lista.innerHTML="";

 let b=fBusca.value.toLowerCase();
 let d=fData.value;
 let s=fStatus.value;

 ag.filter(a=>{
  if(b && !a.cliente.toLowerCase().includes(b) && !(a.tel||"").includes(b)) return false;
  if(d && a.data!==d) return false;
  if(s==="pago"&&!a.pago) return false;
  if(s==="pendente"&&a.pago) return false;
  return true;
 }).forEach(a=>{
  lista.innerHTML+=`
   <div class="ag">
    <b>${a.data} ${a.hora}</b><br>
    ${a.cliente} — R$ ${a.valor}<br>
    ${a.pago?"✅ Pago":"⏳"}
    <br>
    <button onclick="pagar(${a.id})">💰</button>
    <button onclick="editar(${a.id})">✏️</button>
    <button onclick="excluir(${a.id})">🗑</button>
   </div>
  `;
 });

 gerarRelatorio();
}

function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;
 tel.value=a.tel;
 data.value=a.data;
 hora.value=a.hora;
 valor.value=a.valor;
 editId=id;
}

function pagar(id){
 let a=ag.find(x=>x.id===id);
 a.pago=true;
 salvarLocal();
 render();
}

function excluir(id){
 ag=ag.filter(a=>a.id!==id);
 salvarLocal();
 render();
}

/* RELATÓRIO */
function gerarRelatorio(){
 let hoje=new Date().toISOString().slice(0,10);
 let mes=hoje.slice(0,7);

 let dT=0,dP=0,mT=0;

 ag.forEach(a=>{
  if(a.data===hoje){
   dT+=a.valor;
   if(a.pago)dP+=a.valor;
  }
  if(a.data.slice(0,7)===mes)mT+=a.valor;
 });

 relatorio.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${dT}</div>
  <div class="rel-item">R$ ${dP}</div>
  <div class="rel-item">R$ ${dT-dP}</div>
  <div class="rel-item">R$ ${mT}</div>
 </div>`;
}

/* DRIVE */
async function salvarDrive(){
 let fileId=localStorage.getItem("fileId");

 let arquivo=new Blob([JSON.stringify(ag)],{type:"application/json"});
 let form=new FormData();

 form.append("metadata", new Blob([JSON.stringify({name:"agenda.json"})],{type:"application/json"}));
 form.append("file",arquivo);

 let url="https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
 let method="POST";

 if(fileId){
  url=`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`;
  method="PATCH";
 }

 let res=await fetch(url,{
  method,
  headers:{Authorization:"Bearer "+accessToken},
  body:form
 });

 let data=await res.json();

 if(!fileId) localStorage.setItem("fileId",data.id);
}

async function carregarDrive(){
 let fileId=localStorage.getItem("fileId");
 if(!fileId) return;

 let res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{
  headers:{Authorization:"Bearer "+accessToken}
 });

 ag=await res.json();
 salvarLocal();
 render();
}

/* AUTO SYNC */
setInterval(()=>{
 if(accessToken){
  carregarDrive();
 }
},10000);

/* CONFIG */
function toggleDrive(){
 let box=document.getElementById("boxDrive");
 box.style.display = box.style.display==="none"?"block":"none";
}

/* INIT */
window.onload=()=>{
 carregarLocal();
 render();
}
</script>

</body>
</html>
