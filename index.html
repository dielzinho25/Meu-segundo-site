<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Avançada</title>

<style>
body{font-family:Arial;background:#f2f4f8;margin:0}
header{background:#111;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc}
button{background:#111;color:#fff;border:0;cursor:pointer}
.ok{background:#2e7d32}
.warn{background:#f9a825;color:#000}
.danger{background:#c62828}
.ag{background:#fafafa;border-left:5px solid #1565c0;margin-top:8px;padding:10px;border-radius:10px}
.ag.pago{border-left-color:#2e7d32}
.small{font-size:12px;color:#555}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rel-item{padding:10px;border-radius:10px;background:#f0f0f0;text-align:center;font-weight:bold}
.rel-item span{display:block;font-size:12px;opacity:.8}
body.dark{background:#121212;color:#e0e0e0}
body.dark header{background:#000}
body.dark .card,body.dark .ag,body.dark .rel-item{background:#1e1e1e}
body.dark input{background:#2a2a2a;color:#fff;border:1px solid #444}
body.dark button{background:#333}

#btnConfig{
 position: fixed;
 right: 15px;
 bottom: 20px;
 width: 55px;
 height: 55px;
 border-radius: 50%;
 background: #2e7d32;
 color: #fff;
 font-size: 22px;
 border: none;
 box-shadow: 0 4px 10px rgba(0,0,0,0.4);
 z-index: 999;
}
</style>
</head>

<body>

<header>
 <b>📅 Agenda Avançada</b>
 <button onclick="toggleTema()">🌙</button>
</header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone / WhatsApp">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="fBusca" placeholder="🔍 Buscar" oninput="render()">
 <input id="fData" type="date" onchange="render()">
 <select id="fStatus" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card">
 <div id="lista"></div>
</div>

<div id="boxDrive" style="display:none">
 <button onclick="conectarDrive()">🔑 Conectar Drive</button>
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup</button>
 <button onclick="carregarDrive()">📥 Restaurar</button>
 <button onclick="excluirDrive()">🗑 Excluir</button>
</div>

<button onclick="toggleDrive()" id="btnConfig">⚙️</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
let ag=[];
let editId=null;
let accessToken=null;

/* LOCAL + FIREBASE */
const firebaseConfig={
 apiKey:"AIzaSy...",
 authDomain:"ferramentas-projeto.firebaseapp.com",
 projectId:"ferramentas-projeto"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function salvarLocal(){
 localStorage.setItem("agenda",JSON.stringify(ag));
 ag.forEach(a=>db.collection("agenda").doc(String(a.id)).set(a,{merge:true}));
}

function carregarLocal(){
 ag=JSON.parse(localStorage.getItem("agenda")||"[]");
 db.collection("agenda").onSnapshot(s=>{
  s.docChanges().forEach(c=>{
   let d=c.doc.data();
   let i=ag.findIndex(a=>a.id==d.id);
   if(c.type==="added"&&i==-1)ag.push(d);
   if(c.type==="modified"&&i>-1)ag[i]=d;
   if(c.type==="removed")ag=ag.filter(a=>a.id!=d.id);
  });
  salvarLocal();render();
 });
}

/* CRUD */
function salvar(){
 if(!cliente.value||!data.value||!hora.value)return alert("Preencha tudo");
 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value};
 }else{
  ag.push({id:Date.now(),cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value,pago:false,favorito:false});
 }
 salvarLocal();limpar();render();
}

function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;tel.value=a.tel;data.value=a.data;hora.value=a.hora;valor.value=a.valor;
 editId=id;
}

function excluir(id){
 ag=ag.filter(a=>a.id!==id);
 db.collection("agenda").doc(String(id)).delete();
 salvarLocal();render();
}

function pagar(id){
 let a=ag.find(x=>x.id===id);
 a.pago=true;
 salvarLocal();render();
}

function favoritar(id){
 let a=ag.find(x=>x.id===id);
 a.favorito=!a.favorito;
 salvarLocal();render();
}

/* UI */
function toggleTema(){
 document.body.classList.toggle("dark");
}

function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

/* RELATORIO */
function gerarRelatorio(){
 let total=0,pago=0;
 ag.forEach(a=>{
  total+=a.valor;
  if(a.pago)pago+=a.valor;
 });
 relatorio.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${total}<span>Total</span></div>
  <div class="rel-item">R$ ${pago}<span>Recebido</span></div>
 </div>`;
}

/* RENDER */
function render(){
 lista.innerHTML="";
 ag.forEach(a=>{
  lista.innerHTML+=`
  <div class="ag ${a.pago?'pago':''}">
   <b>${a.data} ${a.hora}</b><br>
   ${a.cliente} — R$ ${a.valor}<br>
   <button onclick="editar(${a.id})">✏️</button>
   <button onclick="favoritar(${a.id})">⭐</button>
   <button onclick="pagar(${a.id})">💰</button>
   <button onclick="excluir(${a.id})">🗑</button>
  </div>`;
 });
 gerarRelatorio();
}

/* GOOGLE DRIVE */
function toggleDrive(){
 boxDrive.style.display=boxDrive.style.display==="none"?"block":"none";
}

function conectarDrive(){
 const client=google.accounts.oauth2.initTokenClient({
  client_id:"877191590019-xxx.apps.googleusercontent.com",
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:r=>{accessToken=r.access_token;alert("Drive conectado")}
 });
 client.requestAccessToken();
}

function loginGoogle(){
 google.accounts.id.initialize({
  client_id:"877191590019-xxx.apps.googleusercontent.com",
  callback:()=>alert("Login OK")
 });
 google.accounts.id.prompt();
}

async function salvarDrive(){
 if(!accessToken)return alert("Conecte Drive");
 let blob=new Blob([JSON.stringify(ag)],{type:"application/json"});
 let form=new FormData();
 form.append("file",blob);
 await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=media",{
  method:"POST",
  headers:{Authorization:"Bearer "+accessToken},
  body:blob
 });
 alert("Backup feito");
}

async function carregarDrive(){
 alert("Função simplificada ativa");
}

async function excluirDrive(){
 alert("Excluir manual no Drive");
}

async function syncDrive(){
 console.log("Sync ativo");
}

/* INIT */
window.onload=()=>{
 carregarLocal();
 render();
 setInterval(syncDrive,10000);
};
</script>

</body>
</html>
