<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passadoria Ediel&Rodrigues</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#121212;color:#fff;margin:0}
header{background:#000;padding:12px}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff}
button{background:#2e7d32;border:0}
.ag{background:#1e1e1e;margin-top:8px;padding:10px;border-radius:10px;border-left:5px solid #1565c0}
.ag.pago{border-left-color:#2e7d32}
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-item{background:#2a2a2a;padding:10px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<header><b>📅 Agenda PRO</b></header>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="busca" placeholder="Buscar..." oninput="render()">
 <input type="date" id="buscaData">
 <select id="status" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <button onclick="loginGoogle()">🔐 Login Google</button>
 <button onclick="salvarDrive()">☁️ Backup Drive</button>
 <button onclick="restaurarDrive()">📥 Restaurar</button>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card" id="lista"></div>

<script>
let ag=[];
let editId=null;
let busca = document.getElementById("busca");
let status = document.getElementById("status");

// LOCAL
function salvarLocal(){localStorage.setItem("agenda",JSON.stringify(ag))}
function carregarLocal(){ag=JSON.parse(localStorage.getItem("agenda")||"[]")}

// LIMPAR
function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

// SALVAR / EDITAR
function salvar(){
 if(!cliente.value||!data.value||!hora.value)return alert("Preencha tudo");

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);

  ag[i]={
   ...ag[i],
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:Number(valor.value) || 0,
   pago: ag[i].pago === true,
   favorito: ag[i].favorito === true
  };

 }else{
  ag.push({
   id:Date.now(),
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:Number(valor.value) || 0,
   pago:false,
   favorito:false
  });
 }

 salvarLocal();

 if(accessToken) salvarDrive(); // 🔥 backup automático

 limpar();
 render();
}

// EDITAR
function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;
 tel.value=a.tel;
 data.value=a.data;
 hora.value=a.hora;
 valor.value=a.valor;
 editId=id;
}

// EXCLUIR
function excluir(id){
 if(confirm("Excluir?")){
  ag=ag.filter(a=>a.id!==id);
  salvarLocal();
  if(accessToken) salvarDrive();
  render();
 }
}

// FAVORITO
function fav(id){
 let a=ag.find(x=>x.id===id);
 a.favorito=!a.favorito;
 salvarLocal();
 render();
}

// PAGAR
function pagar(id){
 let a = ag.find(x => x.id === id);

 a.pago = !a.pago;

 salvarLocal();
 if(accessToken) salvarDrive();
 render();
 }

// REAGENDAR
function reagendar(id){
 let a = ag.find(x => x.id === id);

 ag.push({
  ...a,
  id: Date.now(),
  pago: false,
  favorito: false
 });

 salvarLocal();
 if(accessToken) salvarDrive();
 render();

 alert("✅ Cópia criada, agora você pode editar");
 }

// DETALHES
function verDetalhes(id){
 let a=ag.find(x=>x.id===id);

 alert(
 "👤 "+a.cliente+
 "\n📞 "+a.tel+
 "\n📅 "+a.data+
 "\n⏰ "+a.hora+
 "\n💰 R$ "+a.valor+
 "\n⭐ "+(a.favorito?"Sim":"Não")+
 "\n💵 "+(a.pago?"Pago":"Pendente")
 );
}

// RELATÓRIO
function gerarRelatorio(){

 let hoje = new Date().toISOString().slice(0,10);
 let mes = hoje.slice(0,7);

 let hojeRecebido = 0;
 let recebidoTotal = 0;
 let pendente = 0;
 let totalMes = 0;

 let totalGeral = 0; // 🔥 NOVO

 // 🔥 só reservados
 let qtd = ag.filter(a => !a.pago).length;

 ag.forEach(a=>{
  let valor = Number(a.valor) || 0;

  // 🔥 TOTAL GERAL (tudo)
  totalGeral += valor;

  // HOJE (pagos hoje)
  if(a.data === hoje && a.pago){
   hojeRecebido += valor;
  }

  // RECEBIDO TOTAL (pagos)
  if(a.pago){
   recebidoTotal += valor;
  }

  // PENDENTE (não pagos)
  if(!a.pago){
   pendente += valor;
  }

  // MÊS (pagos)
  if(a.data && a.data.startsWith(mes) && a.pago){
   totalMes += valor;
  }
 });

 relatorio.innerHTML = `
 <div class="rel-box">
  <div class="rel-item">R$ ${totalGeral.toFixed(2)}<br>Total Geral</div>
  <div class="rel-item">R$ ${hojeRecebido.toFixed(2)}<br>Hoje</div>
  <div class="rel-item">R$ ${recebidoTotal.toFixed(2)}<br>Recebido</div>
  <div class="rel-item">R$ ${pendente.toFixed(2)}<br>Pendente</div>
  <div class="rel-item">R$ ${totalMes.toFixed(2)}<br>Mês</div>
  <div class="rel-item">${qtd}<br>Reservados</div>
 </div>`;
  }

 
// RENDER (ATUALIZADO)
function render(){

 lista.innerHTML = "";

 ag
 .filter(a=>{
  let b = busca.value.toLowerCase();
  let d = document.getElementById("buscaData")?.value || "";

  // 🔎 busca nome ou telefone
  if(b && !a.cliente.toLowerCase().includes(b) && !(a.tel||"").includes(b)) return false;

  // 📅 filtro por data
  if(d && a.data !== d) return false;

  // 💰 filtro status
  if(status.value === "pago" && !a.pago) return false;
  if(status.value === "pendente" && a.pago) return false;

  return true;
 })
 .sort((a,b)=> b.favorito - a.favorito || a.hora.localeCompare(b.hora))
 .forEach(a=>{
  lista.innerHTML += `
  <div class="ag ${a.pago ? 'pago' : ''}">
   <b>${a.data} ${a.hora}</b><br>
   ${a.favorito ? "⭐ " : ""}${a.cliente} — R$ ${Number(a.valor).toFixed(2)}

   <div>${a.tel || ""}</div>

   <button onclick="verDetalhes(${a.id})">👁</button>
   <button onclick="editar(${a.id})">✏️</button>
   <button onclick="pagar(${a.id})">💰</button>
   <button onclick="fav(${a.id})">⭐</button>
   <button onclick="reagendar(${a.id})">🔁</button>
   <button onclick="excluir(${a.id})">🗑</button>
  </div>`;
 });

 // 📊 atualiza relatório
 gerarRelatorio();
 }

// NOTIFICAÇÃO
function ativarNotif(){
 if(Notification.permission !== "granted"){
  Notification.requestPermission();
 }
}

function notificar(titulo, corpo){
 if(Notification.permission === "granted"){
  navigator.serviceWorker.getRegistration().then(reg=>{
   if(reg){
    reg.showNotification(titulo,{
     body:corpo,
     icon:"https://cdn-icons-png.flaticon.com/512/1827/1827392.png"
    });
   }else{
    new Notification(titulo,{body:corpo});
   }
  });
 }
}

// GOOGLE
let tokenClient;
let accessToken=null;

const CLIENT_ID="877191590019-7ob34ind8ksu4fjp91orrrrvnk9p10hp.apps.googleusercontent.com";

function initGoogle(){
 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:(res)=>{
   if(res.error)return alert("Erro login");
   accessToken=res.access_token;
   localStorage.setItem("token",accessToken);
   alert("Login OK");
  }
 });
}

function loginGoogle(){
 tokenClient.requestAccessToken();
}

// BACKUP
async function salvarDrive(){
 if(!accessToken){
  alert("Faça login primeiro");
  return;
 }

 let nomePasta = "AgendaApp";

 // 🔍 1. BUSCAR OU CRIAR PASTA
 let res = await fetch(
  `https://www.googleapis.com/drive/v3/files?q=name='${nomePasta}' and mimeType='application/vnd.google-apps.folder' and trashed=false`,
  { headers:{ Authorization:"Bearer "+accessToken } }
 );

 let data = await res.json();
 let pastaId;

 if(data.files.length > 0){
  pastaId = data.files[0].id;
 }else{
  let pasta = await fetch(
   "https://www.googleapis.com/drive/v3/files",
   {
    method:"POST",
    headers:{
     Authorization:"Bearer "+accessToken,
     "Content-Type":"application/json"
    },
    body: JSON.stringify({
     name:nomePasta,
     mimeType:"application/vnd.google-apps.folder"
    })
   }
  );

  let nova = await pasta.json();
  pastaId = nova.id;
 }

 // 🔥 2. VER SE JÁ EXISTE ARQUIVO
 let busca = await fetch(
  `https://www.googleapis.com/drive/v3/files?q=name='agenda_backup.json' and '${pastaId}' in parents and trashed=false`,
  { headers:{ Authorization:"Bearer "+accessToken } }
 );

 let arquivos = await busca.json();
 let fileId = arquivos.files?.[0]?.id;

 let conteudo = JSON.stringify(ag);

 // 🔥 3. SE EXISTE → ATUALIZA
 if(fileId){
  await fetch(
   `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
   {
    method:"PATCH",
    headers:{
     Authorization:"Bearer "+accessToken,
     "Content-Type":"application/json"
    },
    body:conteudo
   }
  );

  alert("☁️ Backup atualizado");
  return;
 }

 // 🔥 4. SE NÃO EXISTE → CRIA NA PASTA
 let form = new FormData();

 form.append("metadata", new Blob([JSON.stringify({
  name:"agenda_backup.json",
  parents:[pastaId]
 })], {type:"application/json"}));

 form.append("file", new Blob([conteudo], {type:"application/json"}));

 let upload = await fetch(
  "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
  {
   method:"POST",
   headers:{
    Authorization:"Bearer "+accessToken
   },
   body:form
  }
 );

 let criado = await upload.json();

 localStorage.setItem("drive_file_id", criado.id);

 alert("✅ Backup criado na pasta AgendaApp");
 }
 
// RESTAURAR
async function restaurarDrive(){
 if(!accessToken){
  alert("Faça login primeiro");
  return;
 }

 let nomePasta = "AgendaApp";

 let pasta = await fetch(
  `https://www.googleapis.com/drive/v3/files?q=name='${nomePasta}' and mimeType='application/vnd.google-apps.folder'`,
  { headers:{ Authorization:"Bearer "+accessToken } }
 );

 let pastaData = await pasta.json();

 if(!pastaData.files.length){
  alert("Pasta não encontrada");
  return;
 }

 let pastaId = pastaData.files[0].id;

 let busca = await fetch(
  `https://www.googleapis.com/drive/v3/files?q=name='agenda_backup.json' and '${pastaId}' in parents`,
  { headers:{ Authorization:"Bearer "+accessToken } }
 );

 let arquivos = await busca.json();

 if(!arquivos.files.length){
  alert("Backup não encontrado");
  return;
 }

 let fileId = arquivos.files[0].id;

 let file = await fetch(
  `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
  { headers:{ Authorization:"Bearer "+accessToken } }
 );

 ag = await file.json();

 salvarLocal();
 render();

 alert("📥 Restaurado com sucesso");
 }
// verificarNotificacoes //
 function verificarNotificacoes(){

 let agora = new Date();

 let hoje = agora.toISOString().slice(0,10);
 let horaAtual = agora.toTimeString().slice(0,5);

 ag.forEach(a=>{
  if(a.data === hoje && a.hora === horaAtual){

   notificar(
    "📅 Agendamento",
    `${a.cliente} às ${a.hora}`
   );

  }
 });
  }
 
 
// INIT
window.onload=()=>{
 carregarLocal();
 render();
 initGoogle();

 // 🔔 PERMISSÃO NOTIFICAÇÃO
 Notification.requestPermission();

 ativarNotif();

 let t=localStorage.getItem("token");
 if(t)accessToken=t;

 // 🔥 VERIFICA AUTOMÁTICO
 setInterval(verificarNotificacoes, 60000);
}

 //serviceWorker//
 if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("sw.js");
 }



 // ... TODO SEU CÓDIGO AQUI (funções, render, etc)

 // 🔥 COLOCA AQUI EMBAIXO
 busca.addEventListener("input", render);
 document.getElementById("buscaData").addEventListener("change", render);
 status.addEventListener("change", render);
 
 
 // Gerar PDF
 async function gerarPDFCliente(){

 let nomeBusca = busca.value.toLowerCase();

 if(!nomeBusca){
  alert("Digite o nome do cliente na busca");
  return;
 }

 let listaCliente = ag.filter(a => 
  a.cliente.toLowerCase().includes(nomeBusca)
 );

 if(listaCliente.length === 0){
  alert("Cliente não encontrado");
  return;
 }

 // 🔥 soma total
 let total = listaCliente.reduce((soma,a)=> soma + (Number(a.valor)||0), 0);

 // 📱 pega telefone (primeiro encontrado)
 let telefone = listaCliente[0].tel || "";

 // 📄 cria PDF
 const { jsPDF } = window.jspdf;
 let doc = new jsPDF();

 doc.setFontSize(14);
 doc.text("Relatório do Cliente", 10, 10);

 doc.setFontSize(12);
 doc.text("Cliente: " + listaCliente[0].cliente, 10, 20);

 let y = 30;

 listaCliente.forEach(a=>{
  doc.text(`${a.data} ${a.hora} - R$ ${a.valor} - ${a.pago ? "Pago" : "Pendente"}`, 10, y);
  y += 8;
 });

 doc.text("Total: R$ " + total.toFixed(2), 10, y + 10);

 // 🔥 salva PDF
 doc.save("relatorio_cliente.pdf");

 // 📲 abre WhatsApp
 if(telefone){
  let msg = `Relatório de atendimentos\nTotal: R$ ${total.toFixed(2)}`;
  let url = `https://wa.me/55${telefone}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
 }
}
 
</script>

</body>
 </html>
