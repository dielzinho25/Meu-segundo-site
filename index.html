<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agenda PRO</title>

<style>
body{font-family:Arial;background:#121212;color:#fff;margin:0}
.card{background:#1e1e1e;margin:10px;padding:15px;border-radius:14px}
input,select,button{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:none}
input,select{background:#2a2a2a;color:#fff}
button{background:#2e7d32;color:#fff;font-weight:bold}

.ag{background:#2a2a2a;margin-top:8px;padding:10px;border-radius:10px}

/* botão flutuante */
#btnConfig{
 position:fixed;
 right:15px;
 bottom:20px;
 width:55px;
 height:55px;
 border-radius:50%;
 background:#2e7d32;
 color:#fff;
 font-size:22px;
 border:none;
 z-index:999;
}

/* box config */
#boxDrive{display:none}

/* relatório */
.rel-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-item{background:#2a2a2a;padding:10px;border-radius:10px;text-align:center}
</style>
</head>

<body>

<div class="card">
 <input id="cliente" placeholder="Cliente">
 <input id="tel" placeholder="Telefone">
 <input id="data" type="date">
 <input id="hora" type="time">
 <input id="valor" type="number" placeholder="Valor">
 <button onclick="salvar()">Salvar</button>
</div>

<div class="card">
 <input id="fBusca" placeholder="Buscar nome ou telefone" oninput="render()">
 <input id="fData" type="date" onchange="render()">

 <select id="fStatus" onchange="render()">
  <option value="todos">Todos</option>
  <option value="pendente">Pendentes</option>
  <option value="pago">Pagos</option>
 </select>
</div>

<div class="card">
 <b>📊 Relatório</b>
 <div id="relatorio"></div>
</div>

<div class="card">
 <div id="lista"></div>
</div>

<!-- CONFIG -->
<div id="boxDrive" class="card">
 <button onclick="salvarDrive()">☁️ Backup</button>
 <button onclick="carregarDrive()">📥 Restaurar</button>
 <button onclick="excluirDrive()">🗑 Excluir</button>
</div>

<button id="btnConfig" onclick="toggleDrive()">⚙️</button>

<script>
let ag=[];
let editId=null;
let accessToken=null;

/* LOCAL */
function salvarLocal(){
 localStorage.setItem("agenda_local",JSON.stringify(ag));
}
function carregarLocal(){
 ag=JSON.parse(localStorage.getItem("agenda_local")||"[]");
}

/* SALVAR */
function salvar(){
 if(!cliente.value||!data.value||!hora.value){
  alert("Preencha tudo");
  return;
 }

 if(editId){
  let i=ag.findIndex(a=>a.id===editId);
  ag[i]={...ag[i],cliente:cliente.value,tel:tel.value,data:data.value,hora:hora.value,valor:+valor.value||0};
 }else{
  ag.push({
   id:Date.now(),
   cliente:cliente.value,
   tel:tel.value,
   data:data.value,
   hora:hora.value,
   valor:+valor.value||0,
   pago:false
  });
 }

 salvarLocal();
 render();
 limpar();
 // 🔥 AUTO ENVIA
if(accessToken){
 salvarDrive();
}

/* LIMPAR */
function limpar(){
 cliente.value=tel.value=data.value=hora.value=valor.value="";
 editId=null;
}

/* RENDER */
function render(){
 lista.innerHTML="";

 let busca=fBusca.value.toLowerCase();
 let dataFiltro=fData.value;
 let status=fStatus.value;

 ag
 .filter(a=>{
  if(busca && !a.cliente.toLowerCase().includes(busca) && !(a.tel||"").includes(busca)) return false;
  if(dataFiltro && a.data!==dataFiltro) return false;
  if(status==="pago" && !a.pago) return false;
  if(status==="pendente" && a.pago) return false;
  return true;
 })
 .forEach(a=>{
  lista.innerHTML+=`
   <div class="ag">
    <b>${a.data} ${a.hora}</b><br>
    ${a.cliente} — R$ ${a.valor}<br>
    ${a.tel||""}<br>
    ${a.pago?"✅ Pago":"⏳ Pendente"}
    <br>
    <button onclick="pagar(${a.id})">💰</button>
    <button onclick="editar(${a.id})">✏️</button>
    <button onclick="excluir(${a.id})">🗑</button>
   </div>
  `;
 });

 gerarRelatorio();
}

/* AÇÕES */
function editar(id){
 let a=ag.find(x=>x.id===id);
 cliente.value=a.cliente;
 tel.value=a.tel;
 data.value=a.data;
 hora.value=a.hora;
 valor.value=a.valor;
 editId=id;
}

function pagar(id){
 let a=ag.find(x=>x.id===id);
 a.pago=true;
 salvarLocal();
 render();
}

function excluir(id){
 ag=ag.filter(a=>a.id!==id);
 salvarLocal();
 render();
}

/* RELATÓRIO */
function gerarRelatorio(){
 let hoje=new Date().toISOString().slice(0,10);
 let mes=hoje.slice(0,7);

 let dT=0,dP=0,mT=0;

 ag.forEach(a=>{
  if(a.data===hoje){
   dT+=a.valor;
   if(a.pago)dP+=a.valor;
  }
  if(a.data.slice(0,7)===mes)mT+=a.valor;
 });

 relatorio.innerHTML=`
 <div class="rel-box">
  <div class="rel-item">R$ ${dT} Dia</div>
  <div class="rel-item">R$ ${dP} Recebido</div>
  <div class="rel-item">R$ ${dT-dP} Pendente</div>
  <div class="rel-item">R$ ${mT} Mês</div>
 </div>`;
}

/* CONFIG */
function toggleDrive(){
 let box=document.getElementById("boxDrive");
 box.style.display = box.style.display==="none"?"block":"none";
}

/* DRIVE (SIMPLES MOCK) */
async function salvarDrive(){
 localStorage.setItem("backup_drive",JSON.stringify(ag));
 alert("Backup salvo ☁️");
}

async function carregarDrive(){
 let dados=JSON.parse(localStorage.getItem("backup_drive")||"[]");
 ag=dados;
 salvarLocal();
 render();
 alert("Restaurado 📥");
}

async function excluirDrive(){
 localStorage.removeItem("backup_drive");
 alert("Excluído 🗑");
}

/* INIT */
window.onload=()=>{
 carregarLocal();
 render();

 setTimeout(()=>{
  if(accessToken){
   carregarDrive();
  }
 },2000);
 }

 setInterval(()=>{
 if(accessToken){
  carregarDrive();
 }
}, 8000); // a cada 8 segundos
 
</script>

</body>
 </html>
